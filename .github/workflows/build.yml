name: build-hakios
on: [workflow_dispatch]
jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - name: clone
        run: git clone -b mtk --depth 1 https://github.com/oosexgang/hakios-xnu-kernel.git hakios
      - name: read the manuals
        run: |
          cd hakios
          echo '===== from-a-clone.md ====='
          cat docs/from-a-clone.md
          echo '===== mtk-porting.md ====='
          cat docs/mtk-porting.md
          echo '===== xnu-deps/setup.sh ====='
          cat xnu-deps/setup.sh
