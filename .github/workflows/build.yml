name: build-hakios
on: [workflow_dispatch]
jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - name: clone hakios (branch mtk)
        run: git clone -b mtk --depth 1 https://github.com/oosexgang/hakios-xnu-kernel.git hakios
      - name: read build scripts
        run: |
          cd hakios
          echo '===== xnu-build.sh ====='
          cat xnu-build.sh
          echo '===== xnu-env.sh ====='
          cat xnu-env.sh
          echo '===== tools ====='
          ls tools
          echo '===== mtkloader ====='
          ls mtkloader
      - name: try build
        run: |
          cd hakios
          bash xnu-build.sh 2>&1 | tail -120
      - name: upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hakios-out
          path: hakios
