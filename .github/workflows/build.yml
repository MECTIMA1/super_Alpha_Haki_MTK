name: build-hakios-redmi9
on: [workflow_dispatch]
jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - name: Get Redmi 9 files from this repo
        uses: actions/checkout@v4
        with:
          path: redmi9-files

      - name: Clone main kernel tree (mtk branch)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh repo clone oosexgang/hakios-xnu-kernel hakios -- -b mtk --depth 1

      - name: Build payload
        run: |
          cd hakios
          chmod +x xl_x6826b
          ./xl_x6826b build

      - name: Upload payload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: redmi9-payload
          path: hakios/build-payload.bin
