name: build-hakios
on: [workflow_dispatch]
jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - name: clone project
        run: git clone -b mtk --depth 1 https://github.com/oosexgang/hakios-xnu-kernel.git hakios
      - name: 1-zig (линкер для лоадера)
        run: cd hakios && bash tools/get-zig.sh > /tmp/s1.log 2>&1; tail -20 /tmp/s1.log
      - name: 2-mtkloader
        run: |
          cd hakios/mtkloader
          bash build.sh > /tmp/s2.log 2>&1 || tail -60 /tmp/s2.log
          ls -la
      - name: 3-fbdiag
        run: |
          cd hakios/mtkloader
          cat build_fbdiag.sh
          bash build_fbdiag.sh > /tmp/s3.log 2>&1 || tail -60 /tmp/s3.log
         
