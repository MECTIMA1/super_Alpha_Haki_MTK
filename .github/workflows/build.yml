name: build-hakios
on: [workflow_dispatch]
jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - name: clone project
        run: git clone -b mtk --depth 1 https://github.com/oosexgang/hakios-xnu-kernel.git hakios
      - name: prep toolchain (clt + theos sdk 16.5)
        run: |
          sudo xcodebuild -license accept || true
          git clone --depth 1 https://github.com/theos/theos.git ~/theos
          mkdir -p ~/theos/sdks
          curl -L -o /tmp/sdks.tar.gz https://github.com/theos/sdks/archive/refs/heads/master.tar.gz
          tar -xzf /tmp/sdks.tar.gz -C ~/theos/sdks --strip-components=1
          ls ~/theos/sdks | grep -i 16.5
      - name: xnu/apply.sh (ядро Apple + патчи)
        run: cd hakios && bash xnu/apply.sh
      - name: xnu-deps/setup.sh (тулчейн)
        run: cd hakios && bash xnu-deps/setup.sh
      - name: BUILD KERNEL
        run: cd hakios && bash xnu-build.sh -j8 -k
      - name: upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hakios-kernel
          path: |
            hakios/xnu-src/xnu-8796.121.2/BUILD
          retention-days: 5
