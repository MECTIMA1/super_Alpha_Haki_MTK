name: Build HakiOS MT6768

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check and build mtkloader
        run: |
          cd mtkloader
          sed -i '' 's/#define MENU_DEFAULT_XNU    1/#define MENU_DEFAULT_XNU    0/' mtkloader.c
          chmod +x build.sh
          ./build.sh || true

      - name: Build XNU Kernel
        run: |
          if [ -f xnu-build.sh ]; then
            chmod +x xnu-build.sh
            ./xnu-build.sh
          else
            make -j$(sysctl -n hw.ncpu)
          fi

      - name: Upload compiled binaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hakios-mt6768-binaries
          path: |
            mtkloader/mtkloader.bin
            xnu-src/**/BUILD/obj/**/mach.*
            build/
