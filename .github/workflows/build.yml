name: Build HakiOS MT6768

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Zig and create xnu-clang wrapper
        run: |
          brew install zig
          sudo mkdir -p /usr/local/bin
          printf '#!/bin/sh\nexec xcrun clang "$@"\n' | sudo tee /usr/local/bin/xnu-clang > /dev/null
          printf '#!/bin/sh\nexec xcrun clang++ "$@"\n' | sudo tee /usr/local/bin/xnu-clang++ > /dev/null
          sudo chmod +x /usr/local/bin/xnu-clang /usr/local/bin/xnu-clang++

      - name: Unpack sources and fetch XNU
        run: |
          tar -xzf src.tar.gz
          mkdir -p xnu-src
          HOST="github.com"
          ORG="apple-oss-distributions"
          REPO="xnu.git"
          git clone --depth 1 --branch xnu-8796.121.2 "https://${HOST}/${ORG}/${REPO}" xnu-src/xnu-8796.121.2
          cd xnu-src/xnu-8796.121.2
          patch -p1 < ../../xnu/redwood.patch || true

      - name: Create availability.pl stub in iPhoneOS SDK
        run: |
          IOS_SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          sudo mkdir -p "${IOS_SDK}/usr/local/libexec"
          printf '#!/usr/bin/perl\nexit 0;\n' | sudo tee "${IOS_SDK}/usr/local/libexec/availability.pl" > /dev/null
          sudo chmod +x "${IOS_SDK}/usr/local/libexec/availability.pl"

      - name: Check and build mtkloader
        run: |
          cd mtkloader
          sed -i '' 's/#define MENU_DEFAULT_XNU    1/#define MENU_DEFAULT_XNU    0/' mtkloader.c
          sed -i '' 's|\./zig-linux-x86_64-0.13.0/zig|zig|g' build.sh
          chmod +x build.sh
          ./build.sh || true

      - name: Build XNU Kernel
        run: |
          chmod +x xnu-build.sh
          ./xnu-build.sh

      - name: Upload compiled binaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hakios-mt6768-out
          path: |
            mtkloader/mtkloader.bin
            xnu-src/**/BUILD/obj/**/mach.*
            build/
            *.bin
