name: build-hakios-redmi9
on: [workflow_dispatch]
jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - name: Clone main kernel tree (mtk branch)
        run: git clone -b mtk --depth 1 https://github.com hakios

      - name: Copy Redmi 9 device files
        run: |
          mkdir -p hakios/devices/lancelot
          git clone --depth 1 https://github.com hakios/devices/lancelot
          cp -f hakios/devices/lancelot/mtkloader/* hakios/mtk/loader/

      - name: Build XNU kernel
        run: |
          cd hakios
          make x6826b_defconfig
          make kernel

      - name: Build mtkloader for Redmi 9
        run: |
          cd hakios/mtk/loader
          chmod +x build.sh
          ./build.sh -DXNU_WDT_SECONDS=30 -DMENU_DEFAULT_XNU=1 -DXNU_EXTRA_ARGS="\"cpus=4 mali=1 emmc_root=1 touchscreen=0\""

      - name: Upload compiled files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: redmi9-hakios-out
          path: |
            hakios/mtk/loader/mtkloader.bin
            hakios/build/
            hakios/prebuilt/
