name: build-hakios-redmi9
on: [workflow_dispatch]
jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - name: Get Redmi 9 files from this repo
        uses: actions/checkout@v4
        with:
          path: redmi9-files

      - name: Clone main kernel tree (mtk branch)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh repo clone oosexgang/hakios-xnu-kernel hakios -- -b mtk --depth 1

      - name: Copy Redmi 9 loader files
        run: |
          if [ -d redmi9-files/mtkloader ]; then
            cp -f redmi9-files/mtkloader/* hakios/mtkloader/
          else
            cp -f redmi9-files/*.c redmi9-files/*.h redmi9-files/*.sh hakios/mtkloader/ 2>/dev/null || true
          fi

      - name: Check or create identity.h stub
        run: |
          if [ ! -f hakios/xnuloader/identity.h ]; then
            cat << 'EOF' > hakios/xnuloader/identity.h
          struct identity_prop { const char *name; unsigned int offset; unsigned int length; };
          static const struct identity_prop identity_root[] = {0};
          static const unsigned char identity_root_data[] = {0};
          static const struct identity_prop identity_product[] = {0};
          static const unsigned char identity_product_data[] = {0};
          static const struct identity_prop identity_haptics[] = {0};
          static const unsigned char identity_haptics_data[] = {0};
          EOF
          fi

      - name: Install zig
        run: brew install zig

      - name: Build mtkloader for Redmi 9
        run: |
          cd hakios/mtkloader
          chmod +x build.sh
          ./build.sh -DXNU_WDT_SECONDS=30 -DMENU_DEFAULT_XNU=1 -DXNU_EXTRA_ARGS="\"cpus=4 mali=1 emmc_root=1 touchscreen=0\""

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: redmi9-hakios-out
          path: |
            hakios/mtkloader/mtkloader.bin
            hakios/prebuilt/
            hakios/tools/
