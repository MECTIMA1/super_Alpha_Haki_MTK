name: build-xnu-emmc
on: [workflow_dispatch]

jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - name: Clone hakios mtk
        run: git clone -b mtk --depth 1 https://github.com hakios

      - name: Setup xnu-deps
        run: |
          cd hakios
          chmod +x xnu-deps/setup.sh
          ./xnu-deps/setup.sh

      - name: Build XNU kernel with eMMC support
        run: |
          cd hakios
          source xnu-env.sh
          make x6826b_defconfig
          make kernel

      - name: Upload compiled kernel
        uses: actions/upload-artifact@v4
        with:
          name: xnu-emmc-kernel
          path: hakios/xnu-src/xnu-8796.121.2/BUILD/obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837
