name: Build HakiOS MT6768

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack sources and fetch XNU
        run: |
          tar -xzf src.tar.gz
          ls -la xnu/
          mkdir -p xnu-src
          HOST="github.com"
          ORG="apple-oss-distributions"
          REPO="xnu.git"
          git clone --depth 1 --branch xnu-8796.121.2 "https://${HOST}/${ORG}/${REPO}" xnu-src/xnu-8796.121.2
          cd xnu-src/xnu-8796.121.2
          patch -p1 < ../../xnu/redwood.patch || true

      - name: Fix missing availability.pl in iPhoneOS SDK
        run: |
          IOS_SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          MAC_SDK=$(xcrun --sdk macosx --show-sdk-path)
          sudo mkdir -p "${IOS_SDK}/usr/local/libexec"
          if [ -f "${MAC_SDK}/usr/local/libexec/availability.pl" ]; then
            sudo cp "${MAC_SDK}/usr/local/libexec/availability.pl" "${IOS_SDK}/usr/local/libexec/"
          else
            AVAIL=$(find /Applications/Xcode* /Library/Developer -name "availability.pl" 2>/dev/null | head -n 1)
            sudo cp "$AVAIL" "${IOS_SDK}/usr/local/libexec/"
          fi
          sudo chmod +x "${IOS_SDK}/usr/local/libexec/availability.pl"

      - name: Check and build mtkloader
        run: |
          cd mtkloader
          sed -i '' 's/#define MENU_DEFAULT_XNU    1/#define MENU_DEFAULT_XNU    0/' mtkloader.c
          chmod +x build.sh
          ./build.sh || true

      - name: Build XNU Kernel
        run: |
          chmod +x xnu-build.sh
          ./xnu-build.sh

      - name: Upload compiled binaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hakios-mt6768-out
          path: |
            mtkloader/mtkloader.bin
            xnu-src/**/BUILD/obj/**/mach.*
            build/
            *.bin
