name: Build HakiOS MT6768

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build XNU Kernel
        run: |
          if [ -f xnu-build.sh ]; then
            chmod +x xnu-build.sh
            ./xnu-build.sh
          elif [ -f Makefile ]; then
            make x6826b_defconfig || true
            make kernel -j$(sysctl -n hw.ncpu) || make -j$(sysctl -n hw.ncpu)
          fi

      - name: Upload compiled kernel
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hakios-mt6768-out
          path: |
            **/mach.*
            build/
            BUILD/
            *.bin
