name: build-hakios
on: [workflow_dispatch]
jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - name: clone hakios (branch mtk)
        run: git clone -b mtk --depth 1 https://github.com/oosexgang/hakios-xnu-kernel.git hakios
      - name: recon tree
        run: |
          cd hakios
          ls
          find . -maxdepth 3 -iname '*hakios-device*' -o -maxdepth 3 -iname '*defconfig*'
      - name: sync device configs (если скрипт найден)
        run: |
          cd hakios
          if [ -f tools/hakios-device.py ]; then python3 tools/hakios-device.py sync x6826b; elif [ -f mtk/tools/hakios-device.py ]; then python3 mtk/tools/hakios-device.py sync x6826b; else echo 'sync script not found - пропускаем'; fi
      - name: build kernel
        run: |
          cd hakios
          make x6826b_defconfig
          make kernel
      - name: upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hakios-out
          path: hakios
